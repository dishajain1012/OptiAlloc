spring.application.name=optialloc

spring.datasource.url=${OPTIALLOC_DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/optialloc}}
spring.datasource.username=${OPTIALLOC_DB_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${OPTIALLOC_DB_PASSWORD:${DATABASE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

optialloc.frontend.url=${OPTIALLOC_FRONTEND_URL:http://localhost:5173}
optialloc.seed.demo-data=${OPTIALLOC_SEED_DEMO_DATA:true}

jwt.secret=${OPTIALLOC_JWT_SECRET:OptiAllocSuperSecretJwtKeyForAuthentication2026}