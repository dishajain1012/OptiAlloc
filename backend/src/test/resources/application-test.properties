spring.datasource.url=${OPTIALLOC_DB_URL:jdbc:postgresql://localhost:5432/optialloc}
spring.datasource.username=${OPTIALLOC_DB_USERNAME:postgres}
spring.datasource.password=${OPTIALLOC_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

jwt.secret=${OPTIALLOC_JWT_SECRET:TestJwtSecretKeyForOptiAlloc2026}